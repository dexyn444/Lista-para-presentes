<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Casamento - Nossos Presentes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 🎁 COLOQUE AQUI OS SEUS PRESENTES 🎁
        // Basta adicionar novos itens seguindo o exemplo abaixo:
        let listaPresentes = [
            { id: 1, nome: "Jogo de Panelas Antiaderentes", link: "https://www.loja.com/panelas" },
            { id: 2, nome: "Airfryer 4 Litros", link: "https://www.loja.com/airfryer" },
            { id: 3, nome: "Liquidificador Turbo", link: "https://www.loja.com/liquidificador" },
            { id: 4, nome: "Jogo de Cama Casal 400 Fios", link: "https://www.loja.com/cama" },
            { id: 5, nome: "Aparelho de Jantar 30 Peças", link: "https://www.loja.com/jantar" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            let whatsappNoivo = localStorage.getItem('whatsapp_noivo') || "5519999999999";
            const inputWhatsapp = document.getElementById('whatsapp-noivo');
            if(inputWhatsapp) inputWhatsapp.value = whatsappNoivo;

            // Se o link tiver ?admin=true, mostra as configurações de WhatsApp
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('admin')) {
                const painelAcesso = document.getElementById('painel-acesso-noivos');
                if (painelAcesso) painelAcesso.classList.remove('hidden');
            }

            renderizarConvite();
        });

        // Salvar número do WhatsApp
        window.salvarWhatsapp = function() {
            const input = document.getElementById('whatsapp-noivo');
            if (input) {
                localStorage.setItem('whatsapp_noivo', input.value);
                alert('Número do WhatsApp salvo com sucesso!');
            }
        }

        // Renderizar Lista na Tela
        window.renderizarConvite = function(filtro = "") {
            const container = document.getElementById('lista-presentes');
            if (!container) return;
            container.innerHTML = "";

            const filtrados = listaPresentes.filter(p => p.nome.toLowerCase().includes(filtro.toLowerCase()));

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-stone-400 col-span-2 text-center py-8">Nenhum presente encontrado.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const card = document.createElement('div');
                card.className = "p-5 rounded-xl border border-stone-200 bg-white shadow-sm flex flex-col justify-between transition hover:shadow";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-medium text-stone-800 text-lg">${p.nome}</h3>
                            <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-medium">Disponível</span>
                        </div>
                        <a href="${p.link}" target="_blank" class="text-xs text-blue-600 hover:underline inline-block mb-4">Ver sugestão de loja &rarr;</a>
                    </div>
                    <div>
                        <button onclick="comprarItem('${p.nome}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm py-2 px-4 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-sm">
                            🎁 Presentear (Avisar no WhatsApp)
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Ação ao clicar em Presentear
        window.comprarItem = function(nomeProduto) {
            const nomeConvidado = prompt("Por favor, digite o seu nome para sabermos quem deu o presente:");
            if (!nomeConvidado || nomeConvidado.trim() === "") return;

            let whatsappNoivo = localStorage.getItem('whatsapp_noivo') || "5519999999999";
            const numero = whatsappNoivo.replace(/\D/g, '');
            const texto = encodeURIComponent(`Olá! Eu sou o(a) ${nomeConvidado} e acabei de escolher o presente "${nomeProduto}" para o casamento de vocês! 💍✨`);
            
            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${texto}`, '_blank');
        }

        window.filtrarPresentes = function() {
            const termo = document.getElementById('busca').value;
            renderizarConvite(termo);
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm py-6 px-4 text-center border-b border-stone-200 relative">
        <h1 class="text-3xl font-serif text-stone-700 tracking-wide">Lista de Casamento</h1>
        <p class="text-stone-500 mt-1">Sua presença é o nosso maior presente, mas se quiser nos mimar, escolha um item abaixo!</p>
        
        <!-- Painel oculto para configurar o WhatsApp (Acesse com ?admin=true) -->
        <div id="painel-acesso-noivos" class="hidden mt-4 max-w-md mx-auto bg-stone-100 p-4 rounded-lg border border-stone-200 text-left">
            <label class="block text-xs font-medium text-stone-600 mb-1">Seu WhatsApp para receber os avisos:</label>
            <div class="flex gap-2">
                <input type="text" id="whatsapp-noivo" placeholder="Ex: 5519999999999" class="w-full px-3 py-1.5 border border-stone-300 rounded text-sm focus:outline-none">
                <button onclick="salvarWhatsapp()" class="bg-stone-700 text-white px-3 py-1.5 rounded text-xs font-medium hover:bg-stone-800">Salvar</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-grow">
        <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h2 class="text-xl font-serif text-stone-700">Presentes Disponíveis</h2>
            <input type="text" id="busca" oninput="filtrarPresentes()" placeholder="Buscar presente..." class="px-4 py-2 border border-stone-300 rounded-lg text-sm w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-stone-500">
        </div>

        <div id="lista-presentes" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Os presentes são gerados automaticamente pelo código acima -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-6 text-xs text-stone-400 border-t border-stone-200 mt-8">
        Feito com ❤️ para o nosso grande dia.
    </footer>

</body>
</html>
